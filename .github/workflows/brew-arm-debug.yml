# Temporary: why does `brew install` of maclib370 end in "Broken pipe" on
# ubuntu-24.04-arm (cc370 homebrew-check)? Not to be merged.
name: brew arm debug
on:
  pull_request:
    paths: ['.github/workflows/brew-arm-debug.yml']
jobs:
  exact:
    # exactly homebrew-check's step: fresh runner, cc370 first, no flags
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm]
        mode: [verbose-notoken, verbose-token]
        attempt: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: install cc370 (${{ matrix.mode }})
        run: |
          brew tap mvslovers/tap
          brew trust mvslovers/tap
          if [ "${{ matrix.mode }}" = verbose-token ]; then
            export HOMEBREW_GITHUB_API_TOKEN="${{ github.token }}"
          fi
          HOMEBREW_DEBUG=1 brew install --verbose --debug mvslovers/tap/cc370 2>&1 | tee install.log
          rc=${PIPESTATUS[0]}
          echo "credential lookups: $(grep -c -E 'gh auth token|git credential' install.log)"
          exit $rc
          brew list --versions cc370 libc370 maclib370
