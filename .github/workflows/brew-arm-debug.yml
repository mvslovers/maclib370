# Temporary: why does `brew install` of maclib370 end in "Broken pipe" on
# ubuntu-24.04-arm (cc370 homebrew-check)? Not to be merged.
name: brew arm debug
on:
  pull_request:
    paths: ['.github/workflows/brew-arm-debug.yml']
jobs:
  exact:
    # exactly homebrew-check's step: fresh runner, cc370 first, no flags
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm]
        mode: [plain, verbose]
        attempt: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: install cc370 (${{ matrix.mode }})
        run: |
          brew tap mvslovers/tap
          brew trust mvslovers/tap
          if [ "${{ matrix.mode }}" = verbose ]; then
            HOMEBREW_DEBUG=1 brew install --verbose --debug mvslovers/tap/cc370
          else
            brew install mvslovers/tap/cc370
          fi
          brew list --versions cc370 libc370 maclib370
